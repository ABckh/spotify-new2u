name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Not a secret: a throwaway Postgres cluster and throwaway keys that exist only
# for the duration of the job. Real values live in the deployment environment.
env:
  POSTGRES_USER: new2u
  POSTGRES_PASSWORD: ci-postgres-password
  POSTGRES_DB: new2u_ci
  DATABASE_URL: postgresql+psycopg://new2u:ci-postgres-password@127.0.0.1:5432/new2u_ci
  TOKEN_ENCRYPTION_KEY: pOTtJ4Ua5bTM3qJ0Rw1wZxGkT6k8Q0rT9WiKx9Yl8qA=
  SESSION_TOKEN_SECRET: ci-session-secret

jobs:
  no-signing-files:
    # No certificate, profile, API key or per-machine signing file in git
    # (WHO-16 S-3, S-4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No signing files tracked
        run: scripts/check-no-signing-files.sh

  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:16.15-alpine, pinned by the digest of the multi-arch index.
        image: postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: new2u
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: new2u_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U new2u -d new2u_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: pip-audit
        # Known vulnerabilities in every pinned dependency (WHO-36 F7). The locks
        # are complete and hashed, so pip-audit reads them without resolving.
        run: |
          pip-audit -r requirements.lock --require-hashes --strict --disable-pip
          pip-audit -r requirements-dev.lock --require-hashes --strict --disable-pip

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

      - name: alembic upgrade head
        # Proves migrations run forward on an empty database. With zero revision
        # files present this creates alembic_version and stops.
        run: alembic upgrade head

  bootstrap:
    # deploy/bootstrap.sh on a throwaway Ubuntu 24.04 machine: this runner
    # (WHO-175). The runner plays a fresh Oracle server, reached over SSH on
    # 127.0.0.1 as a sudo user, exactly as scripts/bootstrap-remote.sh reaches
    # the real one. Then it is deployed, re-deployed, and rolled back (WHO-176),
    # and backed up to MinIO and restored (WHO-181).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the throwaway server
        run: scripts/ci/bootstrap-target.sh setup

      - name: Bootstrap, first run
        run: |
          set -o pipefail
          scripts/bootstrap-remote.sh 2>&1 | tee "$RUNNER_TEMP/bootstrap-1.log"

      - name: Bootstrap, second run changes nothing
        run: |
          set -o pipefail
          scripts/bootstrap-remote.sh 2>&1 | tee "$RUNNER_TEMP/bootstrap-2.log"
          grep -x 'changed=0' "$RUNNER_TEMP/bootstrap-2.log"

      - name: Check the result
        run: scripts/ci/bootstrap-target.sh verify

      # WHO-176: the same runner, now a bootstrapped server, gets deployed with
      # scripts/deploy-remote.sh, the script the production job runs. Only the
      # inputs differ: a local registry with a password stands in for GHCR,
      # generated values for the secrets, Caddy uses tls internal.
      - name: Registry and images (good1, good2, broken)
        run: scripts/ci/deploy-target.sh images

      - name: Deploy inputs
        run: scripts/ci/deploy-target.sh inputs

      - name: Deploy good1, the first release
        env:
          API_IMAGE: ${{ env.IMAGE_GOOD1 }}
        run: |
          scripts/deploy-remote.sh
          scripts/ci/deploy-target.sh checks
          scripts/ci/deploy-target.sh release "$IMAGE_GOOD1"
          scripts/ci/deploy-target.sh snapshot "$RUNNER_TEMP/state-good1"

      - name: Deploy good1 again changes nothing
        env:
          API_IMAGE: ${{ env.IMAGE_GOOD1 }}
        run: |
          scripts/deploy-remote.sh
          scripts/ci/deploy-target.sh same "$RUNNER_TEMP/state-good1"

      - name: Deploy good2, the second release
        env:
          API_IMAGE: ${{ env.IMAGE_GOOD2 }}
        run: |
          scripts/deploy-remote.sh
          scripts/ci/deploy-target.sh release "$IMAGE_GOOD2" "$IMAGE_GOOD1"

      - name: Deploy broken, rolls back to good2
        env:
          API_IMAGE: ${{ env.IMAGE_BROKEN }}
          HEALTH_TIMEOUT_SECONDS: "45"
        run: |
          status=0
          scripts/deploy-remote.sh || status=$?
          [[ $status == 1 ]] || { echo "expected exit 1 (rolled back), got $status" >&2; exit 1; }
          scripts/ci/deploy-target.sh release "$IMAGE_GOOD2" "$IMAGE_GOOD1"
          scripts/ci/deploy-target.sh checks

      # WHO-181: the nightly backup. MinIO stands in for the S3 bucket; the
      # server's key there can list, write and delete, not read. A local
      # listener stands in for the heartbeat service (WHO-182). Every deploy
      # above ran without backup settings, which is the "backups off" case.
      - name: Backup bucket, key and age key pair (MinIO)
        run: scripts/ci/backup-target.sh bucket

      - name: Deploy good2 with backup settings
        env:
          API_IMAGE: ${{ env.IMAGE_GOOD2 }}
        run: scripts/deploy-remote.sh

      # GITHUB_ENV values reach only later steps, so the steps that write
      # one (row, seed-old) stand alone.
      - name: Write a test row
        run: scripts/ci/backup-target.sh row

      - name: Backup, then restore it into an empty database
        run: |
          scripts/ci/backup-target.sh run
          scripts/ci/backup-target.sh restore

      - name: Put dumps from 10, 8 and 6 days ago in the bucket
        run: scripts/ci/backup-target.sh seed-old

      - name: Second backup deletes dumps older than 7 days
        run: |
          scripts/ci/backup-target.sh run
          scripts/ci/backup-target.sh retention

      - name: A failed backup is visible and sends no heartbeat
        run: scripts/ci/backup-target.sh fail

      # WHO-182 N1: a key that cannot delete, and the job leaves retention to
      # the bucket's lifecycle rule.
      - name: Take delete off the key, put a 10-day-old dump in the bucket
        run: scripts/ci/backup-target.sh no-delete

      - name: Deploy with BACKUP_PRUNE=off, back up, the old dump stays
        env:
          API_IMAGE: ${{ env.IMAGE_GOOD2 }}
          BACKUP_PRUNE: "off"
        run: |
          scripts/deploy-remote.sh
          scripts/ci/backup-target.sh run
          scripts/ci/backup-target.sh kept

      - name: Deploy without backup settings turns backups off
        env:
          API_IMAGE: ${{ env.IMAGE_GOOD2 }}
        run: |
          unset BACKUP_S3_ENDPOINT BACKUP_S3_REGION BACKUP_S3_BUCKET \
            BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_AGE_RECIPIENT \
            BACKUP_PRUNE BACKUP_HEARTBEAT_URL
          scripts/deploy-remote.sh
          scripts/ci/backup-target.sh off

      - name: Stack logs
        if: failure()
        run: |
          scripts/ci/bootstrap-target.sh logs
          scripts/ci/backup-target.sh logs

  image:
    # The tested commit, built once and pushed to GHCR for api and poller
    # (WHO-176). Pushes to main only, after every check above passed. amd64:
    # the server is x86_64. Nothing deploys from here: production is only the
    # Deploy workflow, run by hand on main (WHO-177 finding 1).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [no-signing-files, checks, bootstrap]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and push ghcr.io/<owner>/new2u:<commit sha>
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/new2u:$GITHUB_SHA"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" .
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image" | tee "$RUNNER_TEMP/push.log"
          docker logout ghcr.io
          # The digest this push printed ("<sha>: digest: sha256:... size: N").
          # Production deploys this, not the tag (WHO-177 finding 9): a tag can
          # be moved, a digest names these exact bytes.
          digest="$(sed -n 's/^.*: digest: \(sha256:[0-9a-f]\{64\}\) size: [0-9]*$/\1/p' "$RUNNER_TEMP/push.log" | tail -n 1)"
          [[ -n "$digest" ]] || { echo "no digest in the push output" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/image"
          printf '%s@%s\n' "${image%:*}" "$digest" >"$RUNNER_TEMP/image/image-ref"
          printf 'Image: `%s@%s`\n' "${image%:*}" "$digest" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the image digest for the Deploy workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-ref
          path: ${{ runner.temp }}/image/image-ref
          if-no-files-found: error
          retention-days: 90
