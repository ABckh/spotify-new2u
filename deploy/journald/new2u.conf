# Install as /etc/systemd/journald.conf.d/new2u.conf, then:
#   sudo systemctl restart systemd-journald
#
# PRD P12 / fixed string W6: every server log is removed from the server after
# 14 days, and from our backups within 7 days after that (WHO-33).
[Journal]
# Keep the journal on disk so it survives a reboot (the restore runbook reads it).
Storage=persistent
# journald deletes whole files, not single entries. A file is deleted when its
# newest entry is older than MaxRetentionSec, and a file spans at most
# MaxFileSec, so an entry can stay MaxRetentionSec + MaxFileSec. 13 + 1 = 14
# days. (With the default MaxFileSec of one month it would be 43 days.)
MaxRetentionSec=13day
MaxFileSec=1day
# The nightly backup (WHO-181) is a database dump only: no journal line is in
# it. Nothing copies the disk, so 14 days is the whole retention. The restore
# runbook replays account_deleted lines from this journal.
# Size cap so a log storm cannot fill the disk.
SystemMaxUse=1G
